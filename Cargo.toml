[package]
name = "revserp-worker-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.32"
reqwest = {
    version = "0.13.4",
    default-features = false,
    features = ["rustls", "gzip", "http2"]
}
scraper = "0.27.0"
serde_json = "1.0"
tokio = {
    version = "1.53.1",
    features = ["macros", "rt-multi-thread", "net"],
}
