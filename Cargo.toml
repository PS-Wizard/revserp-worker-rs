[package]
name = "revserp-worker-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
reqwest = {
    version = "0.13.4",
    default-features = false,
    features = ["rustls", "gzip"]
}
scraper = "0.27.0"
tokio = {
    version = "1.53.1",
    features = ["macros", "rt-multi-thread"]
}
